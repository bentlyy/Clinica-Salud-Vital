# ============================================================
# PostgreSQL 15 — Clinic Optimized Config
# For: 4GB RAM VM (Oracle Cloud), 2 vCPU, SSD storage
# ============================================================

# ── CONNECTIONS ──────────────────────────────────────────────
listen_addresses = '*'
max_connections = 50
superuser_reserved_connections = 3

# ── MEMORY ──────────────────────────────────────────────────
# 25% of 4GB for shared_buffers
shared_buffers = 1GB

# OS cache optimization
effective_cache_size = 3GB

# Per-sort/hash operation memory
# Conservative: 4MB × 50 connections = 200MB max concurrent
work_mem = 4MB

# Hash join threshold before going to disk
maintenance_work_mem = 256MB

# Sort operations
temp_buffers = 32MB

# ── WAL / WRITE AHEAD LOG ──────────────────────────────────
wal_buffers = 64MB
checkpoint_completion_target = 0.9
wal_compression = on
max_wal_size = 2GB
min_wal_size = 1GB

# ── QUERY PLANNER ──────────────────────────────────────────
random_page_cost = 1.1          # SSD optimization
effective_io_concurrency = 200  # SSD optimization
default_statistics_target = 200 # Better query plans
join_collapse_limit = 8
from_collapse_limit = 8

# ── PARALLEL QUERY ─────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ── LOGGING ────────────────────────────────────────────────
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000  # Log queries > 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: user=%u,db=%d '

# ── AUTOVACUUM ─────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400

# ── CLIENT CONNECTION DEFAULTS ─────────────────────────────
statement_timeout = 60000       # 60s global (clinic_app overrides to 30s)
lock_timeout = 15000            # 15s global
idle_in_transaction_session_timeout = 30000  # 30s
timezone = 'America/Santiago'
lc_messages = 'en_US.UTF-8'

# ── SSL (production) ───────────────────────────────────────
ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file = '/var/lib/postgresql/server.key'
ssl_ca_file = '/var/lib/postgresql/ca.crt'

# ── EXTENSIONS ─────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'

# ── PG STAT STATEMENTS ────────────────────────────────────
pg_stat_statements.max = 10000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
pg_stat_statements.track_planning = off
