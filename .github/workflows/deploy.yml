name: Deploy

on:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript Check
        run: npm run typecheck
      - name: Build Backend
        run: npm run build:backend
      - name: Test Backend
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

  deploy:
    needs: [quality, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        shell: bash

      - name: Wait for deployment and health check
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              BODY=$(curl -s "${{ secrets.RENDER_APP_URL }}/health")
              DB_STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('checks',{}).get('database',{}).get('status','error'))" 2>/dev/null || echo "error")
              if [ "$DB_STATUS" = "ok" ]; then
                echo "Health check passed! App + DB are running."
                exit 0
              fi
              echo "Health endpoint returned 200 but DB status is $DB_STATUS — still waiting..."
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE - waiting 10s..."
            sleep 10
          done
          echo "Deploy health check failed after 30 retries"
          exit 1
        shell: bash
