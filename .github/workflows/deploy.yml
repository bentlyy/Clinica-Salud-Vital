name: Deploy

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        shell: bash

      - name: Wait for deployment and health check
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! App is running."
              exit 0
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE - waiting 10s..."
            sleep 10
          done
          echo "Deploy health check failed after 30 retries"
          exit 1
        shell: bash
