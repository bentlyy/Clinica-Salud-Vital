services:
  # ─── Backend API ───────────────────────────────────────────
  - type: web
    name: clinic-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: node dist/scripts/migrate.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: TOTP_ISSUER
        value: ClinicApp
      - key: SMS_PROVIDER
        value: log
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_TENANT_ID
        value: default
      - key: APP_LOCALE
        value: es
      - key: LOG_LEVEL
        value: info
      - key: PHI_MASTER_KEY
        sync: false
      - key: AUDIT_HMAC_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INVITE_JWT_SECRET
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ALLOWED_DOMAINS
        sync: false
      - key: DB_CA_CERT
        sync: false

  # ─── Frontend v3 (Static Site) ─────────────────────────────
  - type: static_site
    name: clinic-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend-v3 && npm install && npm run build
    staticPublishPath: ./frontend-v3/dist
    routes:
      - type: rewrite
        from: /*
        to: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api
