<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Flujo de autenticación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · Vitaria</p>
    <h1>Vitaria — flujo de login con 2FA</h1>

    <svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-seq-title auth-seq-desc">
      <title id="auth-seq-title">Login con 2FA</title>
      <desc id="auth-seq-desc">El navegador envía credenciales al API Express, que consulta el usuario en PostgreSQL, verifica el hash con bcrypt y, dentro de un fragmento ALT, devuelve 400 si falta el TOTP o emite JWT en cookies si el token es válido.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =================================================================
           LIFELINES — Browser 180 · API 500 · PostgreSQL 820
           ================================================================= -->
      <line x1="180" y1="128" x2="180" y2="676" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="128" x2="500" y2="676" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="820" y1="128" x2="820" y2="676" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           ACTIVATION BARS
           ================================================================= -->
      <!-- API holds control for the whole request -->
      <rect x="496" y="180" width="8" height="476" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- PostgreSQL during the read -->
      <rect x="816" y="224" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- PostgreSQL during refresh-token insert -->
      <rect x="816" y="556" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- =================================================================
           M1: Browser → API  POST /login
           ================================================================= -->
      <line x1="180" y1="180" x2="492" y2="180" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="292" y="164" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="174" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /LOGIN</text>

      <!-- =================================================================
           M2: API → PostgreSQL  select user + tenant
           ================================================================= -->
      <line x1="508" y1="224" x2="812" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="580" y="208" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="218" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SELECT · USER + TENANT</text>

      <!-- =================================================================
           M3: PostgreSQL → API  return (dashed + filled)
           ================================================================= -->
      <line x1="812" y1="264" x2="508" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="592" y="248" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER · HASH BCRYPT</text>

      <!-- =================================================================
           M4: API self  bcrypt.compare
           ================================================================= -->
      <path d="M 500,308 L 560,308 L 560,324 L 500,324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="568" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">BCRYPT.COMPARE</text>

      <!-- =================================================================
           ALT COMBINED FRAGMENT — spans Browser · API · PostgreSQL
           Frame: x=120 y=344 w=760 h=332
           ================================================================= -->
      <rect x="120" y="344" width="760" height="332" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <!-- Operator tab: ALT -->
      <rect x="120" y="344" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="140" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

      <!-- Region 1 guard -->
      <text x="132" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[totp habilitado]</text>

      <!-- M5: API self  verify TOTP -->
      <path d="M 500,396 L 552,396 L 552,412 L 500,412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="560" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">VERIFY TOTP</text>

      <!-- M6: API → Browser  400 · 2FA_REQUIRED (return: dashed + filled) -->
      <line x1="500" y1="448" x2="188" y2="448" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="260" y="432" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">400 · 2FA_REQUIRED</text>

      <!-- alt region divider -->
      <line x1="128" y1="496" x2="872" y2="496"
            stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Region 2 guard -->
      <text x="132" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · token ok]</text>

      <!-- M7: API → PostgreSQL  insert session + refresh -->
      <line x1="508" y1="556" x2="812" y2="556" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="552" y="540" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="550" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSERT · SESSION + REFRESH</text>

      <!-- M8: PostgreSQL → API  ok (return: dashed + filled) -->
      <line x1="812" y1="600" x2="508" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="596" y="584" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="594" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK · SESSION_ID</text>

      <!-- M9: API → Browser  200 (headline success, coral) -->
      <line x1="500" y1="644" x2="188" y2="644" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="260" y="628" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="638" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · JWT + COOKIES</text>

      <!-- =================================================================
           ACTOR BOXES — drawn after arrows
           ================================================================= -->
      <!-- Browser (input / soft) -->
      <rect x="108" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="108" y="64" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="116" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="132" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="180" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Navegador</text>
      <text x="180" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React SPA</text>

      <!-- API Express (focal) -->
      <rect x="428" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="64" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="436" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="450" y="81" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Express</text>
      <text x="500" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth · JWT · tenant</text>

      <!-- PostgreSQL (backend) -->
      <rect x="748" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="748" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="756" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="770" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="820" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="820" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">usuarios · sesiones</text>

      <!-- =================================================================
           LEGEND
           ================================================================= -->
      <line x1="96" y1="700" x2="864" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="96" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="96" y="736" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="116" y="745" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

      <rect x="220" y="732" width="28" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="229" y="742" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALT</text>
      <text x="256" y="745" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragmento</text>

      <line x1="360" y1="741" x2="388" y2="741" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="396" y="745" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada HTTP</text>

      <line x1="500" y1="741" x2="528" y2="741" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="536" y="745" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respuesta</text>

      <line x1="640" y1="741" x2="668" y2="741" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="745" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Éxito</text>
    </svg>
  </div>
</body>
</html>
