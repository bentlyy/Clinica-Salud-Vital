<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Capas del frontend</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 920px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Capas · Frontend · Vitaria</p>
    <h1>Vitaria — capas del frontend React</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fe-layers-title fe-layers-desc">
      <title id="fe-layers-title">Capas del frontend</title>
      <desc id="fe-layers-desc">Pila de capas del frontend: páginas y rutas protegidas, módulos funcionales, UI compartida, providers de estado como capa focal, tema e i18n, y la capa de API con Axios.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Direction column (left margin) -->
      <text x="60" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">UI</text>
      <line x1="80" y1="96" x2="80" y2="428" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="76,428 84,428 80,436" fill="#4f5d75"/>
      <text x="52" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HTTP</text>

      <!-- Stack container hairlines (top + bottom edges) -->
      <line x1="120" y1="80" x2="940" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="464" x2="940" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L1 — Pages & routing -->
      <rect x="120" y="80" width="820" height="64" fill="#ffffff"/>
      <line x1="120" y1="144" x2="940" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="260" y="118" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Páginas y rutas</text>
      <text x="940" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">react-router · protected-route</text>

      <!-- L2 — Functional modules -->
      <rect x="120" y="144" width="820" height="64" fill="#f5f5f5"/>
      <line x1="120" y1="208" x2="940" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="260" y="182" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Módulos funcionales</text>
      <text x="940" y="182" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">28 módulos</text>

      <!-- L3 — Shared UI -->
      <rect x="120" y="208" width="820" height="64" fill="#ececec"/>
      <line x1="120" y1="272" x2="940" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="260" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">UI compartida</text>
      <text x="940" y="246" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">loading · error · empty · hooks</text>

      <!-- L4 — Providers / state (FOCAL, coral tint + coral stroke) -->
      <rect x="120" y="272" width="820" height="64" fill="rgba(235,108,54,0.08)"/>
      <rect x="120" y="272" width="820" height="64" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="308" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L4</text>
      <text x="260" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Providers · Estado</text>
      <text x="940" y="310" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">context · auth · tenant · theme</text>

      <!-- L5 — Theme & i18n -->
      <rect x="120" y="336" width="820" height="64" fill="#ececec"/>
      <line x1="120" y1="400" x2="940" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="260" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Tema e i18n</text>
      <text x="940" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">claro/oscuro · es · en</text>

      <!-- L6 — API layer -->
      <rect x="120" y="400" width="820" height="64" fill="#ececec"/>
      <text x="140" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
      <text x="260" y="438" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Capa de API</text>
      <text x="940" y="438" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">axios · interceptors · auto-refresh</text>

      <!-- Caption -->
      <text x="120" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="244" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Los Context sin memoización recomputan el árbol en cada cambio — foco del plan de mejora.</text>
    </svg>
  </div>
</body>
</html>
