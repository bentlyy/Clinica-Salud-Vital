<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Seguridad por capas</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1500px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1320px; display: block; }

    /* ===== Interactive security boxes ===== */
    .sec-box { cursor: pointer; transition: transform 0.15s ease; }
    .sec-box:hover { transform: translateY(-3px); }
    .sec-box.hovered .box-main { stroke-width: 2; }
    .sec-box .box-main { transition: stroke-width 0.15s ease, fill 0.15s ease; }
    .sec-box.hovered .box-main { filter: drop-shadow(0 6px 12px rgba(45,49,66,0.14)); }
    .hint {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--color-muted);
      opacity: 0.75;
      letter-spacing: 0.08em;
    }

    /* ===== Popover ===== */
    .popover {
      position: fixed;
      width: 360px;
      max-width: 90vw;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 18px 48px rgba(45,49,66,0.22), 0 4px 12px rgba(45,49,66,0.12);
      border: 1px solid rgba(45,49,66,0.12);
      padding: 18px 20px;
      color: var(--color-ink);
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 50;
    }
    .popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .popover.tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .popover h3 {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin: 0 0 6px 0;
    }
    .popover .txt {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      line-height: 1.5;
      color: #3a4152;
      margin-bottom: 10px;
    }
    .popover .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .popover .chip {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      background: rgba(45,49,66,0.06);
      border: 1px solid rgba(45,49,66,0.12);
      padding: 2px 7px;
      border-radius: 20px;
      color: #4f5d75;
    }
    .popover .tab { font-size: 0.94rem; }
    .popover .close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: rgba(45,49,66,0.06);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--color-muted);
      line-height: 1;
    }
    .popover .close:hover { background: rgba(45,49,66,0.14); }
    .popover .foot { font-family: var(--font-mono); font-size: 0.6rem; color: #9aa3b5; letter-spacing: 0.06em; border-top: 1px solid rgba(45,49,66,0.08); padding-top: 8px; }

    rect[data-id] { cursor: pointer; }
    rect[data-id].interactive:hover { opacity: 0.86; }

    /* ===== Fullscreen modal ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45,49,66,0.55);
      backdrop-filter: blur(3px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: #ffffff;
      border-radius: 14px;
      max-width: 720px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      box-shadow: 0 28px 80px rgba(45,49,66,0.35);
      padding: 30px 34px 26px;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.22s ease;
      position: relative;
    }
    .overlay.open .modal { transform: translateY(0) scale(1); }
    .modal .m-tag {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 5px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .modal h2 {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 400;
      letter-spacing: -0.015em;
      margin: 0 0 6px 0;
      color: var(--color-ink);
    }
    .modal .m-eyebrow { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b5; margin-bottom: 14px; }
    .modal .m-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px 0; }
    .modal .m-chip {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      background: rgba(45,49,66,0.06);
      border: 1px solid rgba(45,49,66,0.12);
      padding: 4px 10px;
      border-radius: 20px;
      color: #4f5d75;
    }
    .modal .m-body { font-family: var(--font-sans); font-size: 0.93rem; line-height: 1.65; color: #333b4e; }
    .modal .m-body p { margin: 0 0 12px 0; }
    .modal .m-body strong { color: var(--color-ink); }
    .modal .m-how { margin-top: 16px; }
    .modal .m-how h4 {
      font-family: var(--font-serif); font-weight: 400; font-size: 1.02rem; color: var(--color-ink);
      margin: 0 0 8px 0;
    }
    .modal .m-how p { font-size: 0.9rem; color: #4a5266; }
    .modal .m-applied {
      margin-top: 18px;
      background: rgba(235,108,54,0.07);
      border-left: 3px solid var(--color-accent);
      border-radius: 6px;
      padding: 12px 16px;
      font-family: var(--font-sans); font-size: 0.85rem; line-height: 1.55; color: #4a4150;
    }
    .modal .m-applied code {
      font-family: var(--font-mono); font-size: 0.78rem;
      background: rgba(45,49,66,0.06); padding: 1px 6px; border-radius: 4px;
    }
    .modal .m-close {
      position: absolute; top: 16px; right: 18px;
      border: none; background: rgba(45,49,66,0.07);
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem; color: var(--color-muted); line-height: 1;
    }
    .modal .m-close:hover { background: rgba(45,49,66,0.15); }
    .modal::-webkit-scrollbar { width: 8px; }
    .modal::-webkit-scrollbar-thumb { background: rgba(45,49,66,0.18); border-radius: 8px; }
  </style>
</head>

    var pop = document.getElementById('popover');
    var popTag = document.getElementById('pop-tag');
    var popTitle = document.getElementById('pop-title');
    var popChips = document.getElementById('pop-chips');
    var popDesc = document.getElementById('pop-desc');
    var popFoot = document.getElementById('pop-foot');

    var overlay = document.getElementById('overlay');
    var mTag = document.getElementById('m-tag');
    var mTitle = document.getElementById('m-title');
    var mEyebrow = document.getElementById('m-eyebrow');
    var mChips = document.getElementById('m-chips');
    var mBody = document.getElementById('m-body');
    var mApplied = document.getElementById('m-applied');

    var activeId = null;

    function fillChips(container, chips, cls) {
      container.innerHTML = '';
      (chips || []).forEach(function (c) {
        var s = document.createElement('span');
        s.className = cls;
        s.textContent = c;
        container.appendChild(s);
      });
    }

    function showPopup(id) {
      var d = DETAILS[id];
      if (!d) return;
      popTag.textContent = d.tag;
      popTitle.textContent = d.title;
      fillChips(popChips, d.chips, 'chip');
      popDesc.textContent = d.desc;
      popFoot.textContent = d.foot || '';
      pop.setAttribute('aria-hidden', 'false');
      pop.classList.add('open');
    }

    function placePopup(rect) {
      var r = rect.getBoundingClientRect();
      var w = pop.offsetWidth || 360;
      var left = r.left + (r.width / 2) - (w / 2);
      left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
      var top = r.top - pop.offsetHeight - 12;
      if (top < 12) top = r.bottom + 12;
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
    }

    function closePopup() {
      pop.classList.remove('open');
      pop.setAttribute('aria-hidden', 'true');
    }

    function openModal(id) {
      var d = DETAILS[id];
      if (!d) return;
      activeId = id;
      closePopup();
      mTag.textContent = d.tag;
      mTitle.textContent = d.title;
      mEyebrow.textContent = d.foot || 'Herramienta del sistema';
      fillChips(mChips, d.chips, 'm-chip');

      var sb = [];
      if (d.title) sb.push('<p><strong>' + d.title + '</strong> ' + (d.wh || '') + '</p>');
      else if (d.wh) sb.push('<p>' + d.wh + '</p>');
      sb.push('<div class="m-how"><h4>Cómo se aplica en el proyecto</h4><p>' + (d.applied || '') + '</p></div>');
      mBody.innerHTML = sb.join('');

      mApplied.innerHTML = (d.desc || '');
      mApplied.setAttribute('data-desc', d.desc || '');

      overlay.setAttribute('aria-hidden', 'false');
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      mTitle.focus();
    }

    function closeModal() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      activeId = null;
      document.body.style.overflow = '';
    }

    var hoverTimer = null;
    document.querySelectorAll('rect[data-id]').forEach(function (rect) {
      rect.addEventListener('mouseenter', function () {
        clearTimeout(hoverTimer);
        if (overlay.classList.contains('open')) return;
        hoverTimer = setTimeout(function () {
          showPopup(rect.getAttribute('data-id'));
          placePopup(rect);
        }, 220);
      });
      rect.addEventListener('mouseleave', function () {
        clearTimeout(hoverTimer);
        setTimeout(closePopup, 350);
      });
      rect.addEventListener('click', function () {
        clearTimeout(hoverTimer);
        openModal(rect.getAttribute('data-id'));
      });
      rect.classList.add('interactive');
    });

    document.querySelector('.popover .close').addEventListener('click', closePopup);
    document.addEventListener('click', function (e) {
      if (!e.target.closest('rect[data-id]') && !e.target.closest('.popover')) closePopup();
    });

    document.getElementById('m-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });
  })();
  </script>
</body>
</html>
