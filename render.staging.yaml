services:
  - type: web
    name: clinic-api-staging
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: node dist/scripts/migrate.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: TOTP_ISSUER
        value: ClinicApp-Staging
      - key: SMS_PROVIDER
        value: log
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_TENANT_ID
        value: staging
      - key: APP_LOCALE
        value: es
      - key: LOG_LEVEL
        value: debug
