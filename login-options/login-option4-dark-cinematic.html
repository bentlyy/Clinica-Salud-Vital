<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opción 4: Dark Cinematic</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      background: #09090b;
      color: #fafafa;
      overflow: hidden;
    }

    /* Animated mesh gradient background */
    .mesh-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .mesh-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
    }

    .blob-1 { width: 600px; height: 600px; background: #e11d48; top: -20%; left: -10%; animation: drift1 12s ease-in-out infinite; }
    .blob-2 { width: 500px; height: 500px; background: #7c3aed; bottom: -15%; right: -5%; animation: drift2 15s ease-in-out infinite; }
    .blob-3 { width: 350px; height: 350px; background: #0891b2; top: 40%; left: 50%; animation: drift3 10s ease-in-out infinite; }

    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px,60px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px,-80px); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,40px) scale(1.2); } }

    /* Grid overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Layout */
    .layout {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-box {
      display: flex;
      width: 880px;
      min-height: 500px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      backdrop-filter: blur(40px);
      overflow: hidden;
    }

    /* Left side: cinematic text */
    .cinema-side {
      flex: 1;
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .cinema-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      color: #fb7185;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      width: fit-content;
      margin-bottom: 32px;
    }

    .cinema-tag .dot {
      width: 6px;
      height: 6px;
      background: #e11d48;
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(225, 29, 72, 0); }
    }

    .cinema-headline {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
    }

    .cinema-headline .gradient {
      background: linear-gradient(135deg, #e11d48, #a855f7, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cinema-desc {
      font-size: 15px;
      color: #a1a1aa;
      line-height: 1.6;
      max-width: 320px;
    }

    .cinema-metrics {
      display: flex;
      gap: 32px;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .metric-val {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .metric-val.pink { color: #fb7185; }
    .metric-val.purple { color: #c084fc; }
    .metric-val.cyan { color: #22d3ee; }

    .metric-label {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Right side: form */
    .form-side {
      width: 380px;
      background: rgba(255,255,255,0.04);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #71717a;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fafafa;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .field input::placeholder { color: #52525b; }

    .field input:focus {
      border-color: #e11d48;
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #52525b;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }

    .pw-eye:hover { color: #e11d48; }

    .totp-field input {
      text-align: center;
      font-size: 28px;
      letter-spacing: 12px;
      font-weight: 700;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #e11d48;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(225, 29, 72, 0.4);
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 12px;
    }

    .links a {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s;
    }

    .links a:hover { color: #e11d48; }
    .links .accent { color: #fb7185; font-weight: 500; }

    .or-sep {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #3f3f46;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .or-sep::before, .or-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .guest-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #71717a;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .guest-btn:hover {
      border-color: rgba(225, 29, 72, 0.4);
      color: #fb7185;
      background: rgba(225, 29, 72, 0.05);
    }

    @media (max-width: 900px) {
      .cinema-side { display: none; }
      .login-box { width: 92%; max-width: 400px; min-height: auto; border-radius: 20px; }
      .form-side { width: 100%; border-left: none; padding: 40px 28px; }
    }
  </style>
</head>
<body>
  <div class="mesh-bg">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
    <div class="mesh-blob blob-3"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="layout">
    <div class="login-box">
      <!-- Cinema Side -->
      <div class="cinema-side">
        <div class="cinema-tag">
          <span class="dot"></span>
          Plataforma v3.0
        </div>
        <h1 class="cinema-headline">
          Tu clínica<br>
          <span class="gradient">en otro nivel</span>
        </h1>
        <p class="cinema-desc">Gestión médica inteligente con analytics predictivos, laboratorio integrado y recordatorios automáticos.</p>
        <div class="cinema-metrics">
          <div>
            <div class="metric-val pink">2.4s</div>
            <div class="metric-label">Tiempo carga</div>
          </div>
          <div>
            <div class="metric-val purple">99.97%</div>
            <div class="metric-label">Uptime</div>
          </div>
          <div>
            <div class="metric-val cyan">SOC 2</div>
            <div class="metric-label">Certificado</div>
          </div>
        </div>
      </div>

      <!-- Form Side -->
      <div class="form-side">
        <div class="form-label">Iniciar sesión</div>

        <form onsubmit="event.preventDefault(); alert('Demo');">
          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="tu@email.com">
          </div>
          <div class="field">
            <label>Contraseña</label>
            <div class="pw-wrap">
              <input type="password" placeholder="••••••••">
              <button type="button" class="pw-eye" onclick="var i=this.previousElementSibling; i.type=i.type==='password'?'text':'password';">show</button>
            </div>
          </div>
          <div class="field totp-field" style="display:none;">
            <label>Código 2FA</label>
            <input type="text" placeholder="000000" maxlength="6">
          </div>
          <button type="submit" class="submit-btn">Entrar</button>
        </form>

        <div class="links">
          <a href="#">Recuperar</a>
          <a href="#" class="accent">Crear cuenta</a>
        </div>

        <div class="or-sep">o</div>

        <button class="guest-btn">Acceder como invitado</button>
      </div>
    </div>
  </div>
</body>
</html>
