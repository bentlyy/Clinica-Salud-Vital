<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opción 6: Floating Card + Particles</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0c0a1d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Gradient glow behind card */
    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      animation: glow-pulse 4s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    .floating-card {
      position: relative;
      z-index: 2;
      width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      backdrop-filter: blur(40px);
      padding: 44px 36px 36px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg { width: 20px; height: 20px; fill: white; }

    .brand-name {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    .lang-toggle button {
      padding: 6px 12px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-toggle button.active {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 28px;
    }

    .input-field {
      margin-bottom: 16px;
    }

    .input-field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.2);
    }

    .input-wrap .field-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-field input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .input-field input::placeholder { color: rgba(255,255,255,0.2); }

    .input-field input:focus {
      border-color: #6366f1;
      background: rgba(255,255,255,0.08);
    }

    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      padding: 4px;
    }

    .pw-toggle:hover { color: #a78bfa; }

    .totp-field input {
      text-align: center;
      font-size: 24px;
      letter-spacing: 10px;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #a78bfa;
      padding-left: 14px;
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
    }

    .remember input { accent-color: #6366f1; }

    .forgot {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot:hover { color: #a78bfa; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .login-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .login-btn:hover::after { transform: translateX(100%); }

    .login-btn:hover {
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .divider-or {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .guest-row {
      display: flex;
      gap: 10px;
    }

    .guest-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .guest-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      color: white;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
    }

    .signup-link a {
      color: #818cf8;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover { text-decoration: underline; }

    @media (max-width: 500px) {
      .floating-card { width: 92%; padding: 32px 24px 28px; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="glow"></div>

  <div class="floating-card">
    <div class="top-row">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <span class="brand-name">Salud Vital</span>
      </div>
      <div class="lang-toggle">
        <button class="active">ES</button>
        <button>EN</button>
      </div>
    </div>

    <h2 class="card-title">Bienvenido</h2>
    <p class="card-subtitle">Ingresa tus credenciales para acceder al sistema</p>

    <form onsubmit="event.preventDefault(); alert('Demo particles');">
      <div class="input-field">
        <label>Email</label>
        <div class="input-wrap">
          <span class="field-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </span>
          <input type="email" placeholder="tu@email.com" autocomplete="email">
        </div>
      </div>

      <div class="input-field">
        <label>Contraseña</label>
        <div class="input-wrap">
          <span class="field-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="var i=this.parentElement.querySelector('input'); i.type=i.type==='password'?'text':'password';">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="input-field totp-field" id="totp" style="display:none;">
        <label>Código de verificación</label>
        <div class="input-wrap">
          <input type="text" placeholder="000000" maxlength="6">
        </div>
      </div>

      <div class="options-row">
        <label class="remember">
          <input type="checkbox"> Recordarme
        </label>
        <a href="#" class="forgot">¿Olvidaste?</a>
      </div>

      <button type="submit" class="login-btn">Iniciar Sesión</button>
    </form>

    <div class="divider-or">o</div>

    <div class="guest-row">
      <button class="guest-btn">🎫 Invitado</button>
      <button class="guest-btn">📱 2FA</button>
    </div>

    <div class="signup-link">
      ¿No tienes cuenta? <a href="#">Regístrate</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const COUNT = 80;
    const MAX_DIST = 120;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        r: Math.random() * 2 + 1,
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(99, 102, 241, 0.4)';
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const q = particles[j];
          const dx = p.x - q.x;
          const dy = p.y - q.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(99, 102, 241, ${0.12 * (1 - dist / MAX_DIST)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
