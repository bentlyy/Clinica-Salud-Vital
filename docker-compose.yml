services:
  api:
    build:
      context: .
      target: production
    container_name: clinic-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: clinic-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: clinic-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: clinic-tunnel
    command: tunnel --config /etc/cloudflared/config.yml run
    env_file:
      - .env
    volumes:
      - ./cloudflare-config.yml:/etc/cloudflared/config.yml
      - ./cloudflare-credentials:/etc/cloudflared
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  db_data:
  api_logs:
