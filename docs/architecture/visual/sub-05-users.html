<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Usuarios</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Usuarios</p>
    <h1>El ciclo de vida de una cuenta: alta, invitación, rol y baja</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-05-users-title sub-05-users-desc">
      <title id="sub-05-users-title">Ciclo de vida de usuarios en Vitaria</title>
      <desc id="sub-05-users-desc">Flujo de alta de usuarios: un administrador crea la cuenta, si hay invitación se genera un token de setup-password enviado por email, el usuario fija su contraseña y queda activo; luego puede cambiar de rol o desactivarse.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- START -->
      <rect x="80" y="240" width="160" height="56" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="160" y="264" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Admin crea</text>
      <text x="160" y="281" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /users</text>

      <!-- DECISION -->
      <path d="M400,208 L480,268 L400,328 L320,268 Z" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1.2"/>
      <text x="400" y="264" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">¿Invitar por</text>
      <text x="400" y="280" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">email?</text>

      <line x1="240" y1="268" x2="320" y2="268" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- YES PATH -->
      <rect x="560" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="660" y="184" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Token setup-password</text>
      <text x="660" y="201" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email · caduca</text>

      <rect x="560" y="248" width="200" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="660" y="272" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Usuario fija clave</text>
      <text x="660" y="289" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bcrypt hash</text>

      <!-- NO PATH -->
      <rect x="560" y="336" width="200" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="660" y="360" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Admin fija clave</text>
      <text x="660" y="377" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entrega directa</text>

      <!-- ACTIVE -->
      <rect x="820" y="248" width="140" height="56" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="890" y="272" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Activo</text>
      <text x="890" y="289" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rol asignado</text>

      <!-- CONNECTORS -->
      <path d="M480,268 H520 Q528,268 528,260 V196 Q528,188 536,188 H560" fill="none" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M480,268 H520 Q528,268 528,276 V364 Q528,372 536,372 H560" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="188" x2="790" y2="188" stroke="#48606f" stroke-width="1.2"/>
      <path d="M790,188 V268 Q790,276 798,276 H820" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="276" x2="820" y2="276" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="364" x2="798" y2="364" stroke="#48606f" stroke-width="1.2"/>
      <path d="M798,364 V276 Q798,268 806,268 H820" fill="none" stroke="#48606f" stroke-width="1.2"/>

      <!-- BRANCH LABELS -->
      <rect x="484" y="152" width="32" height="12" rx="2" fill="#f6f8fb"/>
      <text x="500" y="162" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sí</text>
      <rect x="484" y="376" width="32" height="12" rx="2" fill="#f6f8fb"/>
      <text x="500" y="386" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no</text>

      <!-- TRANSITIONS OUT OF ACTIVE -->
      <line x1="890" y1="304" x2="890" y2="436" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="740" y="436" width="140" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="810" y="460" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Cambio de rol</text>
      <text x="810" y="477" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RBAC</text>

      <rect x="920" y="436" width="60" height="56" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="950" y="468" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Baja</text>

      <line x1="880" y1="436" x2="860" y2="436" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="900" y1="436" x2="920" y2="436" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ROLES -->
      <rect x="80" y="416" width="600" height="140" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="96" y="440" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ROLES DEL SISTEMA</text>
      <text x="96" y="472" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Superadmin · Admin de clínica · Recepción</text>
      <text x="96" y="496" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Profesional · Enfermería · Laboratorio · Facturación</text>
      <text x="96" y="528" fill="#48606f" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Las capacidades se resuelven por rol y se re-evalúan en cada petición.</text>

      <!-- CALLOUT -->
      <line x1="40" y1="572" x2="960" y2="572" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="592" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Verificar: consumidor del token setup-password · revocación de sesión al cambiar rol o dar de baja</text>
    </svg>
  </div>
</body>
</html>
