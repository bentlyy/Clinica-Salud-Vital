<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Base de datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DB schema · Base de datos</p>
    <h1>Cómo se relacionan las 49 tablas alrededor del paciente</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-15-database-title sub-15-database-desc">
      <title id="sub-15-database-title">Esquema de datos de Vitaria</title>
      <desc id="sub-15-database-desc">Modelo de datos: tenants agrupa usuarios, pacientes, especialidades y el log de auditoría. El paciente encadena citas, encuentros, órdenes de laboratorio y facturas. Todas las tablas de negocio llevan tenant_id y políticas RLS.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- TENANTS (focal) -->
      <rect x="400" y="88" width="200" height="56" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="500" y="112" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">tenants</text>
      <text x="500" y="130" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clínica · plan · estado</text>

      <!-- RLS FAN -->
      <path d="M500,144 V168" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M140,196 V168 H860 V196" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M140,168 V196" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M392,168 V196" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M608,168 V196" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M860,168 V196" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="380" y="156" width="86" height="12" rx="2" fill="#f6f8fb"/>
      <text x="423" y="166" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tenant_id + RLS</text>

      <!-- TIER 1 -->
      <rect x="60" y="196" width="160" height="60" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="140" y="222" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">users</text>
      <text x="140" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rol · password_hash</text>

      <rect x="312" y="196" width="160" height="60" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="392" y="222" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">patients</text>
      <text x="392" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">demografía · contacto</text>

      <rect x="528" y="196" width="160" height="60" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="608" y="222" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">specialties</text>
      <text x="608" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">catálogo clínico</text>

      <rect x="780" y="196" width="160" height="60" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="860" y="222" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">audit_log</text>
      <text x="860" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">append-only</text>

      <!-- TIER 2 CHAIN -->
      <rect x="60" y="320" width="160" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="140" y="346" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">appointments</text>
      <text x="140" y="364" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">estado · profesional</text>

      <rect x="312" y="320" width="160" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="392" y="346" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">encounters</text>
      <text x="392" y="364" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">firma · addendum</text>

      <rect x="528" y="320" width="160" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="608" y="346" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">lab_orders</text>
      <text x="608" y="364" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">resultados</text>

      <rect x="780" y="320" width="160" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="860" y="346" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">invoices</text>
      <text x="860" y="364" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pagos · estado</text>

      <!-- RELATIONS -->
      <line x1="392" y1="256" x2="140" y2="320" stroke="#48606f" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="228" y="278" width="76" height="12" rx="2" fill="#f6f8fb"/>
      <text x="266" y="288" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 : N</text>

      <line x1="140" y1="380" x2="392" y2="380" stroke="#48606f" stroke-width="1"/>
      <path d="M312,356 V380" fill="none" stroke="#48606f" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="236" y="372" width="60" height="12" rx="2" fill="#f6f8fb"/>
      <text x="266" y="382" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cita → nota</text>

      <path d="M472,350 H528" fill="none" stroke="#48606f" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="486" y="332" width="52" height="12" rx="2" fill="#f6f8fb"/>
      <text x="512" y="342" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 : N</text>

      <path d="M392,256 V300 Q392,308 400,308 H660 Q668,308 668,316 V320" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="656" y="292" width="60" height="12" rx="2" fill="#f6f8fb"/>
      <text x="686" y="302" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">factura</text>

      <!-- FOOTER -->
      <rect x="60" y="416" width="880" height="72" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="80" y="442" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">49 tablas · motor PostgreSQL · acceso por SQL directo (sin ORM)</text>
      <text x="80" y="466" fill="#48606f" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Migraciones versionadas 001–031 · 357 líneas de políticas RLS en security.sql</text>
      <text x="80" y="484" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace">331 puntos de acceso a base de datos identificados en el inventario</text>

      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="548" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">El paciente es el eje: todo lo clínico y lo financiero cuelga de él, y todo está filtrado por clínica.</text>
      <text x="40" y="572" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Relaciones simplificadas para lectura; el esquema completo está en db/init.sql y db/migrations</text>
    </svg>
  </div>
</body>
</html>
