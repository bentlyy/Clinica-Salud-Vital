<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Notificaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Notificaciones</p>
    <h1>Un correo no bloquea la consulta: se encola, se traduce y se reintenta</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-10-notifications-title sub-10-notifications-desc">
      <title id="sub-10-notifications-title">Secuencia de notificaciones en Vitaria</title>
      <desc id="sub-10-notifications-desc">Un evento de negocio encola una notificación, un cron drena la cola, se resuelve el idioma del paciente y la plantilla, se envía por SendGrid o SMTP, se guarda el estado y se reintenta si falla.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6f8e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <line x1="140" y1="128" x2="140" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="380" y1="128" x2="380" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="620" y1="128" x2="620" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="860" y1="128" x2="860" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>

      <line x1="140" y1="176" x2="380" y2="176" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M380,216 H436 Q444,216 444,224 V232 Q444,240 436,240 H380" fill="none" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M380,280 H436 Q444,280 444,288 V296 Q444,304 436,304 H380" fill="none" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="344" x2="620" y2="344" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="620" y1="384" x2="380" y2="384" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="380" y1="424" x2="860" y2="424" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="464" x2="380" y2="464" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M300,504 H260 Q252,504 252,496 V456 Q252,448 260,448 H300" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="172" y="156" width="176" height="12" rx="2" fill="#f6f8fb"/>
      <text x="260" y="166" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">evento → encolar</text>

      <rect x="452" y="224" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="508" y="234" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">cron drena</text>

      <rect x="452" y="288" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="508" y="298" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">idioma + plantilla</text>

      <rect x="452" y="324" width="96" height="12" rx="2" fill="#f6f8fb"/>
      <text x="500" y="334" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">send</text>

      <rect x="452" y="364" width="96" height="12" rx="2" fill="#f6f8fb"/>
      <text x="500" y="374" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">accepted</text>

      <rect x="620" y="404" width="96" height="12" rx="2" fill="#f6f8fb"/>
      <text x="668" y="414" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">estado</text>

      <rect x="452" y="444" width="96" height="12" rx="2" fill="#f6f8fb"/>
      <text x="500" y="454" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">logueado</text>

      <rect x="196" y="470" width="64" height="12" rx="2" fill="#f6f8fb"/>
      <text x="228" y="480" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">reintento</text>

      <rect x="70" y="88" width="140" height="40" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="140" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Dominio</text>
      <text x="140" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cita · factura · lab</text>

      <rect x="310" y="88" width="140" height="40" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="380" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Cola + Cron</text>
      <text x="380" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">node-cron · worker</text>

      <rect x="550" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="550" y="88" width="140" height="40" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="620" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">SendGrid / SMTP</text>
      <text x="620" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proveedor de envío</text>

      <rect x="790" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="790" y="88" width="140" height="40" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="860" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="860" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notifications log</text>

      <line x1="40" y1="568" x2="960" y2="568" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="590" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">La notificación es asíncrona: la operación de negocio nunca espera al proveedor de correo.</text>
      <text x="40" y="610" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FND-T3: idiomas del backend (es/en) vs. UI (4 idiomas) · FND-T2: los logs viven solo en ficheros locales</text>
    </svg>
  </div>
</body>
</html>
