<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Infraestructura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Infraestructura</p>
    <h1>Del commit al servicio vivo: CI, contenedor y hosting gestionado</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-16-infrastructure-title sub-16-infrastructure-desc">
      <title id="sub-16-infrastructure-title">Despliegue e infraestructura de Vitaria</title>
      <desc id="sub-16-infrastructure-desc">GitHub Actions ejecuta el pipeline sobre cada push, construye la imagen Docker y la despliega en Render junto a PostgreSQL gestionado. Un temporizador programa copias de seguridad y las variables de entorno llegan por secretos.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- PIPELINE LANE -->
      <rect x="40" y="96" width="160" height="64" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="120" y="122" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">git push</text>
      <text x="120" y="140" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rama principal</text>

      <rect x="240" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="340" y="122" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">GitHub Actions</text>
      <text x="340" y="140" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lint · build · tests</text>

      <rect x="480" y="96" width="180" height="64" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="570" y="122" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Imagen Docker</text>
      <text x="570" y="140" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dockerfile multi-stage</text>

      <rect x="700" y="96" width="260" height="64" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="830" y="122" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Render</text>
      <text x="830" y="140" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web service · deploy automático</text>

      <line x1="200" y1="128" x2="240" y2="128" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="128" x2="480" y2="128" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="660" y1="128" x2="700" y2="128" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- RUNTIME ZONE -->
      <rect x="40" y="216" width="560" height="248" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <rect x="56" y="220" width="96" height="12" rx="2" fill="#f6f8fb"/>
      <text x="104" y="230" fill="rgba(13,61,56,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICIO EN VIVO</text>

      <rect x="72" y="248" width="200" height="64" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="172" y="274" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">API Express</text>
      <text x="172" y="292" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Node 20 · /api · /health</text>

      <rect x="72" y="328" width="200" height="64" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="172" y="354" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Workers</text>
      <text x="172" y="372" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cron · cola · informes</text>

      <rect x="328" y="248" width="256" height="64" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="456" y="274" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">PostgreSQL gestionado</text>
      <text x="456" y="292" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RLS activo · migraciones 001–031</text>

      <rect x="328" y="328" width="256" height="64" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="456" y="354" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Almacenamiento de adjuntos</text>
      <text x="456" y="372" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UPLOAD_DIR (¿persistente?)</text>

      <rect x="72" y="408" width="512" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="72" y="408" width="512" height="40" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="328" y="432" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">clinic-backup.timer — copias programadas</text>

      <line x1="272" y1="280" x2="328" y2="280" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="172" y1="312" x2="172" y2="328" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M172,392 V408 H72" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- SECRETS -->
      <rect x="632" y="216" width="328" height="248" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <rect x="648" y="220" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="704" y="230" fill="rgba(13,61,56,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONFIGURACIÓN</text>

      <text x="648" y="268" fill="#0d9488" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">VARIABLES DE ENTORNO</text>
      <text x="648" y="292" fill="#0d3d38" font-size="10" font-family="'Geist Mono', monospace">DATABASE_URL · JWT_SECRET</text>
      <text x="648" y="310" fill="#0d3d38" font-size="10" font-family="'Geist Mono', monospace">SENDGRID_API_KEY · SMTP_*</text>
      <text x="648" y="328" fill="#0d3d38" font-size="10" font-family="'Geist Mono', monospace">MERCADOPAGO_ACCESS_TOKEN</text>
      <text x="648" y="346" fill="#0d3d38" font-size="10" font-family="'Geist Mono', monospace">RECAPTCHA_SECRET_KEY · SENTRY_DSN</text>
      <text x="648" y="364" fill="#0d3d38" font-size="10" font-family="'Geist Mono', monospace">METRICS_TOKEN · UPLOAD_DIR</text>

      <line x1="648" y1="388" x2="944" y2="388" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="648" y="412" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">SIN ESQUEMA CENTRAL</text>
      <text x="648" y="434" fill="#0d3d38" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">FND-T5: falta src/config/ y validación de env</text>
      <text x="648" y="452" fill="#0d3d38" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">FND-T2: los logs solo viven en ficheros locales</text>

      <line x1="40" y1="500" x2="960" y2="500" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>

      <!-- UNVERIFIED -->
      <rect x="40" y="520" width="920" height="72" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="60" y="546" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">A VERIFICAR EN EL ENTORNO REAL</text>
      <text x="60" y="570" fill="#0d3d38" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Plan de Render · secretos cargados · persistencia de UPLOAD_DIR · ejecución efectiva del timer de backup · si el frontend se despliega aparte</text>
      <text x="60" y="586" fill="#0d3d38" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Migraciones y seeds aplicados en producción · si RUN_SEEDS / SEED_ON_STARTUP están activos</text>
    </svg>
  </div>
</body>
</html>
