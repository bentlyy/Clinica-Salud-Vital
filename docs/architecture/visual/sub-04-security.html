<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Seguridad</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Seguridad</p>
    <h1>Defensa en capas: qué detiene cada escudo antes del negocio</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-04-security-title sub-04-security-desc">
      <title id="sub-04-security-title">Capas de seguridad de Vitaria</title>
      <desc id="sub-04-security-desc">Cadena de defensas en profundidad: cabeceras helmet, CORS con allowlist, protección de contaminación de parámetros, saneado de HTML, rate limiting, CSRF por doble envío, bcrypt para contraseñas, reCAPTCHA en formularios públicos y auditoría.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- ENTRY -->
      <rect x="360" y="96" width="280" height="44" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="500" y="115" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Petición no confiable</text>
      <text x="500" y="130" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Internet</text>
      <line x1="500" y1="140" x2="500" y2="160" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LAYERS -->
      <rect x="280" y="160" width="440" height="44" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="316" y="187" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">helmet</text>
      <text x="500" y="187" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cabeceras HTTP seguras</text>

      <rect x="280" y="212" width="440" height="44" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="316" y="239" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">cors</text>
      <text x="500" y="239" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allowlist de orígenes</text>

      <rect x="280" y="264" width="440" height="44" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="316" y="291" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">hpp</text>
      <text x="500" y="291" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contaminación de parámetros</text>

      <rect x="280" y="316" width="440" height="44" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="316" y="343" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">sanitize-html</text>
      <text x="500" y="343" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entradas ricas → XSS fuera</text>

      <rect x="280" y="368" width="440" height="44" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="316" y="395" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">rate limit</text>
      <text x="500" y="395" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">por IP y por ruta · anti-abuso</text>

      <rect x="280" y="420" width="440" height="44" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="316" y="447" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">CSRF</text>
      <text x="500" y="447" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">doble envío con cookie httpOnly</text>

      <rect x="280" y="472" width="440" height="44" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="316" y="499" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">bcrypt · reCAPTCHA</text>
      <text x="500" y="499" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contraseñas y formularios públicos</text>

      <rect x="360" y="536" width="280" height="44" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="500" y="563" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Lógica de negocio</text>

      <!-- CONNECTORS -->
      <line x1="500" y1="204" x2="500" y2="212" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="256" x2="500" y2="264" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="308" x2="500" y2="316" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="360" x2="500" y2="368" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="412" x2="500" y2="420" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="464" x2="500" y2="472" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="516" x2="500" y2="536" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- SIDE: audit -->
      <rect x="800" y="368" width="160" height="96" rx="6" fill="#f6f8fb"/>
      <rect x="800" y="368" width="160" height="96" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="880" y="392" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Auditoría</text>
      <text x="880" y="410" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quién · qué · cuándo</text>
      <text x="880" y="426" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">por tenant</text>
      <text x="880" y="448" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cada acción sensible</text>
      <path d="M720,442 H760 Q768,442 768,442 H800" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- CALLOUT -->
      <line x1="40" y1="612" x2="960" y2="612" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="636" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">Ninguna capa es suficiente sola; juntas reducen la superficie.</text>
      <text x="40" y="658" fill="#48606f" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Los 2 focos marcan lo que más carga hace: el control de abuso y el CSRF que protege las cookies de sesión.</text>
      <text x="40" y="680" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Verificar: sanitizado aplicado en todos los campos ricos · límites por ruta sensibles (login, pagos)</text>
    </svg>
  </div>
</body>
</html>
