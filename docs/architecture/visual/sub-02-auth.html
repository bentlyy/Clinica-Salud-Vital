<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Autenticación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Autenticación</p>
    <h1>Cómo entra un usuario: login, 2FA y refresco de token</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-02-auth-title sub-02-auth-desc">
      <title id="sub-02-auth-title">Secuencia de autenticación de Vitaria</title>
      <desc id="sub-02-auth-desc">Secuencia de login: la SPA llama a la API Express, que valida con Zod, verifica reCAPTCHA, busca el usuario en PostgreSQL, compara el hash con bcrypt, rota el refresh token y devuelve una cookie httpOnly más un token CSRF.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6f8e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- LIFELINES -->
      <line x1="120" y1="128" x2="120" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="320" y1="128" x2="320" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="500" y1="128" x2="500" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="700" y1="128" x2="700" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="880" y1="128" x2="880" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- ARROWS -->
      <line x1="120" y1="176" x2="320" y2="176" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="320" y1="216" x2="880" y2="216" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="880" y1="256" x2="320" y2="256" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="320" y1="296" x2="700" y2="296" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="336" x2="320" y2="336" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M320,376 H376 Q384,376 384,384 V400 Q384,408 376,408 H320" fill="none" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="320" y1="448" x2="700" y2="448" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="488" x2="120" y2="488" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- ARROW LABELS -->
      <rect x="152" y="156" width="136" height="12" rx="2" fill="#f6f8fb"/>
      <text x="220" y="166" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/auth/login</text>

      <rect x="544" y="196" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="600" y="206" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">reCAPTCHA verify</text>

      <rect x="544" y="236" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="600" y="246" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · score ok</text>

      <rect x="446" y="276" width="128" height="12" rx="2" fill="#f6f8fb"/>
      <text x="510" y="286" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SELECT usuario × email</text>

      <rect x="446" y="316" width="128" height="12" rx="2" fill="#f6f8fb"/>
      <text x="510" y="326" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">fila + password_hash</text>

      <rect x="392" y="384" width="88" height="12" rx="2" fill="#f6f8fb"/>
      <text x="436" y="394" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">bcrypt.compare</text>

      <rect x="446" y="428" width="128" height="12" rx="2" fill="#f6f8fb"/>
      <text x="510" y="438" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE refresh_token</text>

      <rect x="152" y="468" width="136" height="12" rx="2" fill="#f6f8fb"/>
      <text x="220" y="478" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 + Cookie/CSRF</text>

      <!-- PARTICIPANT HEADERS (drawn last so lifelines sit behind) -->
      <rect x="50" y="88" width="140" height="40" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="120" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">SPA React</text>
      <text x="120" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cliente</text>

      <rect x="250" y="88" width="140" height="40" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="320" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">API Express</text>
      <text x="320" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/auth · middlewares</text>

      <rect x="430" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="430" y="88" width="140" height="40" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="500" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Módulo Auth</text>
      <text x="500" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jwt · totp · bcrypt</text>

      <rect x="630" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="630" y="88" width="140" height="40" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="700" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="700" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">users · refresh_tokens</text>

      <rect x="810" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="810" y="88" width="140" height="40" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="880" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Servicios</text>
      <text x="880" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reCAPTCHA · SendGrid</text>

      <!-- CALLOUT -->
      <line x1="50" y1="568" x2="950" y2="568" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="50" y="588" fill="#48606f" font-size="11" font-style="italic" font-family="'Instrument Serif', serif">Si el usuario activó 2FA, la API responde un reto intermedio y el token final solo se emite tras verificar el código TOTP.</text>
      <text x="50" y="606" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FND: refresh tokens rotados y hasheados en BD · access token corto en memoria · CSRF por cookie</text>
    </svg>
  </div>
</body>
</html>
