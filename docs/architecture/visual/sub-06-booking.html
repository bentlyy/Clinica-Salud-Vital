<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Agenda</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Agenda</p>
    <h1>Los estados de una cita, del pedido al cierre</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-06-booking-title sub-06-booking-desc">
      <title id="sub-06-booking-title">Máquina de estados de una cita en Vitaria</title>
      <desc id="sub-06-booking-desc">La cita pasa de solicitada a confirmada, luego en espera, en consulta y completada. Desde solicitada o confirmada puede cancelarse y desde confirmada puede registrarse como no asistió.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- INITIAL -->
      <circle cx="52" cy="268" r="8" fill="#0d3d38"/>
      <line x1="60" y1="268" x2="96" y2="268" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- STATES -->
      <rect x="96" y="240" width="140" height="56" rx="8" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="166" y="264" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Solicitada</text>
      <text x="166" y="281" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">requested</text>

      <rect x="300" y="240" width="140" height="56" rx="8" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="370" y="264" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Confirmada</text>
      <text x="370" y="281" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">confirmed</text>

      <rect x="504" y="240" width="140" height="56" rx="8" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="574" y="264" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">En espera</text>
      <text x="574" y="281" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checked_in</text>

      <rect x="708" y="240" width="140" height="56" rx="8" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="778" y="264" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">En consulta</text>
      <text x="778" y="281" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in_progress</text>

      <rect x="860" y="380" width="120" height="56" rx="8" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="920" y="404" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Completada</text>
      <text x="920" y="421" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">completed</text>

      <!-- EXIT STATES -->
      <rect x="300" y="380" width="140" height="56" rx="8" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="370" y="404" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Cancelada</text>
      <text x="370" y="421" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cancelled</text>

      <rect x="504" y="380" width="140" height="56" rx="8" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="574" y="404" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">No asistió</text>
      <text x="574" y="421" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no_show</text>

      <!-- MAIN TRANSITIONS -->
      <line x1="236" y1="268" x2="300" y2="268" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="440" y1="268" x2="504" y2="268" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="644" y1="268" x2="708" y2="268" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M848,268 H910 Q918,268 918,276 V380" fill="none" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- EXIT TRANSITIONS -->
      <path d="M166,296 V408 Q166,416 174,416 H300" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M370,296 V380" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M574,296 V380" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- TRANSITION LABELS -->
      <rect x="248" y="248" width="40" height="12" rx="2" fill="#f6f8fb"/>
      <text x="268" y="258" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">confirma</text>

      <rect x="452" y="248" width="40" height="12" rx="2" fill="#f6f8fb"/>
      <text x="472" y="258" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">llega</text>

      <rect x="656" y="248" width="40" height="12" rx="2" fill="#f6f8fb"/>
      <text x="676" y="258" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">inicia</text>

      <rect x="176" y="344" width="52" height="12" rx="2" fill="#f6f8fb"/>
      <text x="202" y="354" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cancela</text>

      <rect x="378" y="332" width="56" height="12" rx="2" fill="#f6f8fb"/>
      <text x="406" y="342" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no asistió</text>

      <rect x="856" y="320" width="48" height="12" rx="2" fill="#f6f8fb"/>
      <text x="880" y="330" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cierra</text>

      <!-- CALLOUT -->
      <line x1="40" y1="464" x2="960" y2="464" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="486" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">El foco está en CONFIRMADA: es el único estado que dispara recordatorios al paciente.</text>
      <text x="40" y="506" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Transiciones auditadas · solapamientos de agenda validados en el servicio</text>
    </svg>
  </div>
</body>
</html>
