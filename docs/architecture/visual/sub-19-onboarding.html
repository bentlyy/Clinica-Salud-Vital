<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Onboarding</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Onboarding</p>
    <h1>El embudo que crea una clínica en una sola transacción</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-19-onboarding-title sub-19-onboarding-desc">
      <title id="sub-19-onboarding-title">Onboarding de clínicas en Vitaria</title>
      <desc id="sub-19-onboarding-desc">El formulario público de contratación llama al alta de tenant, que en una transacción crea clínica, admin, suscripción activa, factura pagada y solicitud pendiente. El superadmin aprueba o rechaza, y el panel de la clínica completa perfil y documentos.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- BAND A -->
      <text x="40" y="96" fill="#0d9488" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ADQUISICIÓN · PÚBLICO</text>

      <rect x="40" y="112" width="150" height="56" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="115" y="136" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Landing</text>
      <text x="115" y="153" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">precios hardcodeados</text>

      <rect x="206" y="112" width="170" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="291" y="136" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">/contratar</text>
      <text x="291" y="153" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stepper de 4 pasos</text>

      <rect x="392" y="112" width="184" height="56" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="484" y="136" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">POST /saas/onboard</text>
      <text x="484" y="153" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">público · 3/h/IP · captcha</text>

      <rect x="592" y="112" width="368" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="776" y="136" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Transacción de alta</text>
      <text x="776" y="153" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tenants · users(admin) · subscriptions(active) · invoice(paid) · onboarding(pending)</text>

      <line x1="190" y1="140" x2="206" y2="140" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="376" y1="140" x2="392" y2="140" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="576" y1="140" x2="592" y2="140" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- BAND B -->
      <text x="40" y="228" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">DESPUÉS DEL ALTA</text>

      <rect x="40" y="244" width="220" height="56" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="150" y="268" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">/gracias</text>
      <text x="150" y="285" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">confirmación estática</text>

      <rect x="320" y="244" width="300" height="56" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="470" y="268" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Panel clínica /settings/onboarding</text>
      <text x="470" y="285" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">perfil + documentos (base64)</text>

      <rect x="680" y="244" width="280" height="56" rx="6" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="820" y="268" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Landing estática (artefacto)</text>
      <text x="820" y="285" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">landing-vitaria.html · vestigial</text>

      <line x1="150" y1="196" x2="150" y2="244" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M290,300 V320 H470 V300" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- BAND C -->
      <text x="40" y="360" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">REVISIÓN · SUPERADMIN</text>

      <rect x="40" y="376" width="220" height="56" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="150" y="400" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">/onboarding-applications</text>
      <text x="150" y="417" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cola de solicitudes</text>

      <polygon points="400,350 480,404 400,458 320,404" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="400" y="400" fill="#0d3d38" font-size="10" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">¿aprobar o</text>
      <text x="400" y="414" fill="#0d3d38" font-size="10" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">rechazar?</text>

      <rect x="560" y="348" width="200" height="56" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="660" y="372" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Aprobar</text>
      <text x="660" y="389" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no-op · sin efecto real</text>

      <rect x="560" y="432" width="200" height="56" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="660" y="456" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Rechazar</text>
      <text x="660" y="473" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no desactiva el tenant</text>

      <rect x="800" y="376" width="160" height="112" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="880" y="422" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Acceso conservado</text>
      <text x="880" y="440" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">el tenant nunca</text>
      <text x="880" y="452" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">se desactiva · FND-S2</text>

      <line x1="260" y1="404" x2="320" y2="404" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M480,404 H520 V376 H560" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M480,404 H520 V460 H560" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M760,376 H780 V418 H800" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M760,460 H780 V450 H800" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="494" y="366" width="52" height="12" rx="2" fill="#f6f8fb"/>
      <text x="520" y="376" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">aprobar</text>
      <rect x="490" y="470" width="60" height="12" rx="2" fill="#f6f8fb"/>
      <text x="520" y="480" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rechazar</text>

      <!-- FOOTER -->
      <rect x="40" y="524" width="920" height="72" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="60" y="550" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">El alta pública emite factura pagada y plan activo sin cobro (FND-S1) y no notifica al admin (FND-S3).</text>
      <text x="60" y="572" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Los documentos viajan en base64 dentro del JSON, limitado a 100 KB (FND-S4).</text>
      <text x="60" y="590" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Detalle completo en docs/architecture/05-findings.md · SUB-19</text>
    </svg>
  </div>
</body>
</html>
