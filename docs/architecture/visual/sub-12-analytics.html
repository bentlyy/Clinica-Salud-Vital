<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Analítica</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Analítica</p>
    <h1>Del dato operativo al panel: cuatro saltos, sin almacén intermedio</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-12-analytics-title sub-12-analytics-desc">
      <title id="sub-12-analytics-title">Flujo de datos de analítica en Vitaria</title>
      <desc id="sub-12-analytics-desc">Los datos operativos de PostgreSQL alimentan consultas de agregación que se exponen como endpoints de analítica y métricas Prometheus, y se consumen en paneles con recharts. No hay un almacén analítico separado.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <!-- STAGE ZONES -->
      <rect x="40" y="144" width="200" height="200" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <rect x="292" y="144" width="200" height="200" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <rect x="544" y="144" width="200" height="200" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <rect x="796" y="144" width="164" height="200" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>

      <text x="140" y="168" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">ORIGEN</text>
      <text x="392" y="168" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">TRANSFORMAR</text>
      <text x="644" y="168" fill="#0d9488" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">SERVIR</text>
      <text x="878" y="168" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">CONSUMIR</text>

      <!-- ORIGIN NODES -->
      <rect x="60" y="188" width="160" height="60" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="140" y="212" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Tablas operativas</text>
      <text x="140" y="228" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">citas · pacientes</text>
      <text x="140" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">facturas · encuentros</text>

      <rect x="60" y="264" width="160" height="60" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="140" y="296" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="140" y="312" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tenant-scoped</text>

      <!-- TRANSFORM -->
      <rect x="312" y="188" width="160" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="392" y="212" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Consultas de agregación</text>
      <text x="392" y="228" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GROUP BY · rangos</text>
      <text x="392" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sin materializar</text>

      <rect x="312" y="264" width="160" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="392" y="288" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Servicios de reporte</text>
      <text x="392" y="304" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDF (pdfkit)</text>
      <text x="392" y="316" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+ métricas prom-client</text>

      <!-- SERVE -->
      <rect x="564" y="188" width="160" height="60" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="644" y="212" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Endpoints</text>
      <text x="644" y="228" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/analytics</text>
      <text x="644" y="240" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/metrics (token)</text>

      <!-- CONSUME -->
      <rect x="816" y="188" width="124" height="60" rx="6" fill="#ffffff" stroke="#0d3d38" stroke-width="1"/>
      <text x="878" y="212" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Panel</text>
      <text x="878" y="228" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">recharts</text>

      <rect x="816" y="264" width="124" height="60" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="878" y="288" fill="#0d3d38" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Scraper</text>
      <text x="878" y="304" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus</text>

      <!-- FLOW ARROWS -->
      <line x1="220" y1="218" x2="292" y2="218" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="294" x2="292" y2="294" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="472" y1="218" x2="564" y2="218" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="724" y1="218" x2="816" y2="218" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M724,270 Q770,270 770,290 V294 H816" fill="none" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LATENCY NOTE -->
      <rect x="40" y="368" width="440" height="128" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="56" y="392" fill="#0d9488" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LO QUE HAY</text>
      <text x="56" y="418" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Analítica dentro de la misma base operativa</text>
      <text x="56" y="440" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Consultas de lectura sobre tablas vivas</text>
      <text x="56" y="462" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Métricas técnicas expuestas por Prometheus</text>
      <text x="56" y="484" fill="#48606f" font-size="9" font-family="'Plus Jakarta Sans', sans-serif">Simple de operar; el costo aparece cuando crece el volumen.</text>

      <rect x="520" y="368" width="440" height="128" rx="8" fill="rgba(13,61,56,0.02)" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="536" y="392" fill="#7c93a1" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LO QUE FALTA</text>
      <text x="536" y="418" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Sin almacén analítico ni capa pre-agregada</text>
      <text x="536" y="440" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Sin caché de resultados por rango</text>
      <text x="536" y="462" fill="#0d3d38" font-size="11" font-family="'Plus Jakarta Sans', sans-serif">Riesgo de consultas pesadas en horario pico</text>
      <text x="536" y="484" fill="#48606f" font-size="9" font-family="'Plus Jakarta Sans', sans-serif">La tabla ml_demand_forecast existe sin código de entrenamiento.</text>

      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="542" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">A verificar: planes de consulta e índices en tablas grandes · si el frontend consume /metrics o solo recharts</text>
    </svg>
  </div>
</body>
</html>
