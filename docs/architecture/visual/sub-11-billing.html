<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaria · Facturación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f6f8fb;
      --color-ink:    #0d3d38;
      --color-muted:  #48606f;
      --color-accent: #0d9488;
      --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Facturación</p>
    <h1>Cobrar con MercadoPago: el webhook es la única verdad</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sub-11-billing-title sub-11-billing-desc">
      <title id="sub-11-billing-title">Secuencia de cobro con MercadoPago en Vitaria</title>
      <desc id="sub-11-billing-desc">La API crea una preferencia de pago en MercadoPago, el paciente paga, MercadoPago confirma por webhook, la API valida la firma y actualiza el estado de la factura en PostgreSQL; el cron marca facturas vencidas como past_due.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#48606f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6f8e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fb"/>

      <line x1="140" y1="128" x2="140" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="380" y1="128" x2="380" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="620" y1="128" x2="620" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="860" y1="128" x2="860" y2="540" stroke="rgba(13,61,56,0.10)" stroke-width="1" stroke-dasharray="4,4"/>

      <line x1="140" y1="176" x2="380" y2="176" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="380" y1="216" x2="620" y2="216" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="620" y1="256" x2="380" y2="256" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="380" y1="296" x2="140" y2="296" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <line x1="140" y1="336" x2="620" y2="336" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="620" y1="376" x2="380" y2="376" stroke="#2f6f8e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M380,416 H436 Q444,416 444,424 V432 Q444,440 436,440 H380" fill="none" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="480" x2="860" y2="480" stroke="#48606f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M300,520 H252 Q244,520 244,512 V496 Q244,488 252,488 H300" fill="none" stroke="#48606f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="172" y="156" width="160" height="12" rx="2" fill="#f6f8fb"/>
      <text x="252" y="166" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /invoices/checkout</text>

      <rect x="452" y="196" width="128" height="12" rx="2" fill="#f6f8fb"/>
      <text x="516" y="206" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">crear preferencia</text>

      <rect x="452" y="236" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="508" y="246" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">init_point</text>

      <rect x="172" y="276" width="160" height="12" rx="2" fill="#f6f8fb"/>
      <text x="252" y="286" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">redirige al pago</text>

      <rect x="452" y="316" width="128" height="12" rx="2" fill="#f6f8fb"/>
      <text x="516" y="326" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">paciente paga</text>

      <rect x="452" y="356" width="128" height="12" rx="2" fill="#f6f8fb"/>
      <text x="516" y="366" fill="#2f6f8e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">webhook pago</text>

      <rect x="452" y="424" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="508" y="434" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">valida firma</text>

      <rect x="620" y="460" width="112" height="12" rx="2" fill="#f6f8fb"/>
      <text x="676" y="470" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE estado</text>

      <rect x="168" y="486" width="64" height="12" rx="2" fill="#f6f8fb"/>
      <text x="200" y="496" fill="#48606f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">past_due</text>

      <rect x="70" y="88" width="140" height="40" rx="6" fill="rgba(72,96,111,0.10)" stroke="#7c93a1" stroke-width="1"/>
      <text x="140" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Paciente / UI</text>
      <text x="140" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">paga</text>

      <rect x="310" y="88" width="140" height="40" rx="6" fill="rgba(13,148,136,0.10)" stroke="#0d9488" stroke-width="1"/>
      <text x="380" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">API Express</text>
      <text x="380" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">billing · webhook</text>

      <rect x="550" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="550" y="88" width="140" height="40" rx="6" fill="rgba(13,61,56,0.03)" stroke="rgba(13,61,56,0.30)" stroke-width="1"/>
      <text x="620" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">MercadoPago</text>
      <text x="620" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checkout · webhooks</text>

      <rect x="790" y="88" width="140" height="40" rx="6" fill="#f6f8fb"/>
      <rect x="790" y="88" width="140" height="40" rx="6" fill="rgba(13,61,56,0.05)" stroke="#48606f" stroke-width="1"/>
      <text x="860" y="106" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="860" y="120" fill="#48606f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">invoices · payments</text>

      <line x1="40" y1="568" x2="960" y2="568" stroke="rgba(13,61,56,0.10)" stroke-width="0.8"/>
      <text x="40" y="590" fill="#0d3d38" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif">El estado de la factura solo cambia cuando llega el webhook verificado, no cuando el usuario vuelve del pago.</text>
      <text x="40" y="610" fill="#7c93a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">A verificar: quién escribe past_due · token de MercadoPago en producción · reintentos/idempotencia del webhook</text>
    </svg>
  </div>
</body>
</html>
